name = "bindog-signaling"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[vars]
# Production only. Local `wrangler dev` overrides this via `.env` (see `.env.example`).
ALLOWED_ORIGINS = "https://bindog.alebatistella.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# Per-IP (per Cloudflare colo) limits. Period must be 10 or 60 seconds.
[[ratelimits]]
name = "TURN_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "ROOM_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

# Production secrets:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_API_TOKEN
#
# Local `wrangler dev` secrets (not shared with production):
#   cp .env.example .env
