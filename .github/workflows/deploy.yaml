name: Deploy workflow
on:
  release:
    types: [published]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

  signaling-deploy:
    name: Signaling Worker deploy
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/bindog-signaling
          packageManager: npm
          command: deploy

  frontend-deploy:
    name: Frontend deploy
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Create .env file
        run: |
          touch .env
          echo VITE_POSTHOG_KEY="${{ secrets.VITE_POSTHOG_KEY }}" >> .env
          echo VITE_POSTHOG_HOST="${{ secrets.VITE_POSTHOG_HOST }}" >> .env
          echo VITE_SITE_URL="${{ secrets.VITE_SITE_URL }}" >> .env
          echo VITE_SIGNALING_URL="${{ secrets.VITE_SIGNALING_URL }}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The FTP action runs as an unprivileged user and writes credentials to ~/.netrc
      # under /github/home (mapped from RUNNER_TEMP/_github_home).
      - name: Make container HOME writable
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          chmod 777 "${RUNNER_TEMP}/_github_home"

      - name: Upload via FTP
        uses: airvzxf/ftp-deployment-action@v2
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: "./dist/client"
          ssl_verify_certificate: "false"
